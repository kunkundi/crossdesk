name: MCP package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check shared CLI and MCP version
        run: python3 scripts/version.py check mcp
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json
      - run: npm ci
        working-directory: apps/mcp
      - run: npm run build
        working-directory: apps/mcp
      - run: npm run pack:npm
        working-directory: apps/mcp
      - uses: actions/upload-artifact@v6
        with:
          name: mcp-package
          path: build/npm-mcp/*.tgz
          if-no-files-found: error
